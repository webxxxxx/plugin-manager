<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="300" height="300">
  <defs>
    <!-- 1. 背景蓝色渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DB8FF"/>
      <stop offset="50%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- 2. 行星环渐变色 (保持变浅、通透) -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- 3. 文字立体果冻渐变 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EAF5FF"/>
      <stop offset="100%" stop-color="#9CCBFB"/>
    </linearGradient>

    <!-- 4. 文字立体阴影滤镜 -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#0A3C8A" flood-opacity="0.6"/>
    </filter>

    <!-- 5. 绿色小球 3D 渐变 -->
    <radialGradient id="greenBallGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F2A9"/>
      <stop offset="50%" stop-color="#5CDA6A"/>
      <stop offset="100%" stop-color="#3AAD48"/>
    </radialGradient>

    <!-- 6. 核心遮罩：配合缩小后的光环，重新划分 3D 遮挡区域 -->
    <mask id="frontRingMask">
      <!-- 全白，显示全部 -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- 挖空左侧区域：让光环隐藏在 S 和 V 的后方 -->
      <rect x="0" y="20" width="58" height="60" fill="black" />
      <!-- 挖空右上区域：让光环只压住 C 的下半部分 (y>53) -->
      <rect x="58" y="20" width="25" height="33" fill="black" />
    </mask>
  </defs>

  <!-- ==================== 1. 圆角背景 ==================== -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bgGrad)" stroke="#83C9FF" stroke-width="1.5" />
  <rect x="5" y="5" width="90" height="90" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />

  <!-- ==================== 2. 后层光环 (缩小尺寸) ==================== -->
  <!-- rx 从 48 减小到 40，ry 从 14 减小到 12 -->
  <ellipse cx="50" cy="50" rx="40" ry="12" transform="rotate(-22 50 50)" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- ==================== 3. 主体文字 "SVC" ==================== -->
  <g filter="url(#textShadow)">
    <text x="50" y="57" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="40" fill="url(#textGrad)" letter-spacing="1">
      SVC
    </text>
  </g>
  <!-- 顶部高光 -->
  <text x="50" y="56" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" opacity="0.4" letter-spacing="1">
    SVC
  </text>

  <!-- ==================== 4. 前层光环 (缩小尺寸，产生 3D 压盖) ==================== -->
  <!-- rx 和 ry 同步缩小，配合新的遮罩 -->
  <ellipse cx="50" cy="50" rx="40" ry="12" transform="rotate(-22 50 50)" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" mask="url(#frontRingMask)" />

  <!-- ==================== 5. 右下角绿色小球 ==================== -->
  <g transform="translate(76, 76)">
    <circle cx="0" cy="1.5" r="8" fill="#0A3C8A" opacity="0.5" filter="blur(1px)"/>
    <circle cx="0" cy="0" r="8" fill="url(#greenBallGrad)" />
    <ellipse cx="-2.5" cy="-2.5" rx="3" ry="2" transform="rotate(-30 -2.5 -2.5)" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>