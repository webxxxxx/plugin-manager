<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svcd 控制台</title>
<style>
  :root { --blue:#3d8fd1; --line:#e4e8ee; --text:#333; --muted:#888; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#f5f7fa; }
  .wrap { max-width:980px; margin:0 auto; padding:24px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 20px; margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .grow { flex:1; }
  button { border:1px solid var(--blue); background:var(--blue); color:#fff; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:13px; }
  button.ghost { background:#fff; color:var(--blue); }
  button.danger { border-color:#d9534f; background:#d9534f; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .menu-wrap { position:relative; display:inline-flex; }
  .menu-btn { padding:5px 10px; font-size:18px; line-height:1; }
  .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:150px; background:#fff; border:1px solid var(--line); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.14); padding:4px; z-index:1001; }
  .menu button { display:block; width:100%; text-align:left; border:0; background:#fff; color:var(--text); padding:8px 12px; border-radius:4px; font-size:13px; }
  .menu button:hover { background:#f0f5fb; }
  button#morebtn { border: none; }
  input[type=password], input[type=text], select { border:1px solid var(--line); border-radius:4px; padding:6px 10px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  th { color:var(--muted); font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.on { background:#e8f5e9; color:#2e7d32; }
  .tag.off { background:#fdecea; color:#c62828; }
  .tag.click { cursor:pointer; user-select:none; }
  .tag.click:hover { filter:brightness(0.94); text-decoration:underline; }
  .muted { color:var(--muted); font-size:12px; }
  label.check { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); white-space:nowrap; }
  label.check input { margin:0; }
  .hidden { display:none; }
  .tablewrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tablewrap table { min-width:640px; }
  #busymask { position:fixed; inset:0; background:rgba(255,255,255,.55); z-index:998; display:none; align-items:center; justify-content:center; }
  #busymask.show { display:flex; }
  #waitspin { width:42px; height:42px; border:4px solid #d6e4f3; border-top-color:var(--blue); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toasts { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast { min-width:260px; max-width:70vw; padding:10px 16px; border-radius:6px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.16); cursor:pointer; white-space:pre-wrap; word-break:break-word; }
  .toast.err { background:#fdecea; color:#b3261e; border:1px solid #f5c2bd; }
  .toast.ok { background:#e8f5e9; color:#1b5e20; border:1px solid #bfe3c3; }
  .toast.info { background:#e8f0fe; color:#1a3c8f; border:1px solid #c2d4f8; }
  .actions { display:flex; gap:6px; flex-wrap:wrap;}
  .actions button { padding:4px 10px; font-size:12px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:99; padding:16px; }
  .modal .panel { background:#fff; border-radius:8px; padding:16px; width:min(780px,100%); max-height:90vh; overflow:auto; }
  .modal textarea { width:100%; height:360px; font-family:monospace; font-size:12px; border:1px solid var(--line); border-radius:4px; padding:8px; }
  .modal pre { background:#f7f8fa; border:1px solid var(--line); border-radius:4px; padding:10px; max-height:50vh; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .modal pre.logs { height:382px; max-height:none; overflow:auto; line-height:1.5; }
  /* Settings uses the log dialog shell: a fixed head/foot, the body scrolls. */
  .modal .panel.sheet { display:flex; flex-direction:column; max-height:90vh; overflow:hidden; padding:0; min-width:0; }
  .sheet .sheet-head { flex:none; padding:16px 16px 0; min-width:0; }
  .sheet .sheet-head h1 { font-size:16px; margin:0; }
  .sheet .sheet-head .muted { overflow-wrap:anywhere; }
  .sheet .sheet-body { flex:1 1 auto; min-height:0; min-width:0; overflow:auto; padding:0 16px 4px; }
  .sheet .sheet-foot { flex:none; display:flex; justify-content:flex-end; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--line); min-width:0; }
  .setting-group { margin:16px 0 0; font-size:13px; font-weight:600; }
  .setting-group:first-child { margin-top:4px; }
  .setting { display:grid; grid-template-columns:minmax(170px,240px) minmax(0,1fr); align-items:center; gap:4px 12px; padding:9px 0; border-bottom:1px solid #f1f3f6; }
  .setting:last-child { border-bottom:0; }
  .setting-label { display:flex; align-items:center; gap:6px; min-width:0; }
  .setting-name { font-size:13px; font-weight:600; }
  .setting-source { font-size:11px; color:var(--muted); white-space:nowrap; }
  .setting-control { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
  .setting-control > input[type=text] { width:100%; }
  .setting-control .readonly { font-size:13px; word-break:break-all; }
  .help { flex:none; width:17px; height:17px; padding:0; border:1px solid #c7d0da; border-radius:50%; background:#fff; color:#7b8794; font-size:11px; line-height:1; cursor:help; }
  .help:hover, .help:focus-visible { border-color:var(--blue); color:var(--blue); }
  #tip { position:fixed; z-index:1002; max-width:min(360px, calc(100vw - 24px)); padding:10px 12px; border-radius:6px; background:#2b3038; color:#fff; font-size:12px; line-height:1.6; box-shadow:0 8px 28px rgba(0,0,0,.28); pointer-events:none; }
  #tip .tip-key { font-family:monospace; color:#9ecbff; margin-bottom:2px; word-break:break-all; }
  #tip .tip-line { margin-top:3px; }
  #tip .tip-tag { color:#aeb8c4; }
  @media (max-width:760px) {
    .wrap { padding:12px; }
    h1 { font-size:18px; }
    .card { padding:12px 14px; }
    #toasts { left:8px; right:8px; transform:none; align-items:stretch; }
    .toast { max-width:none; min-width:0; }
    .sheet .sheet-head, .sheet .sheet-body, .sheet .sheet-foot { padding-left:14px; padding-right:14px; }
    .setting { grid-template-columns:1fr; gap:4px; }
  }
</style>
</head>
<body>
<div id="busymask"><div id="waitspin"></div></div>
<div id="toasts"></div>
<div id="tip" role="tooltip" hidden></div>
<div class="wrap">
  <div id="login" class="card hidden">
    <h1>svcd 控制台</h1>
    <p class="muted">输入 `svc lan passwd` 设置的密码（默认 loopback 无需登录，直接打开即可）。</p>
    <div class="row">
      <input id="pass" type="password" placeholder="密码" style="width:280px">
      <button onclick="login()">登录</button>
      <span id="loginMsg" class="muted"></span>
    </div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <div class="row">
        <h1 class="grow" style="margin:0">svcd 控制台</h1>
        <button class="ghost" onclick="load()">刷新</button>
        <button class="ghost" onclick="logout()">退出</button>
        <span class="menu-wrap">
          <button class="ghost menu-btn" id="morebtn" onclick="toggleMore(event)" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作" title="更多">⋮</button>
          <div class="menu hidden" id="moremenu" role="menu">
            <button role="menuitem" onclick="openSettings()">设置</button>
            <button role="menuitem" onclick="openUpgrade()">检查更新</button>
            <button role="menuitem" onclick="openDaemonLogs()">查看日志</button>
            <button role="menuitem" onclick="pickTrust()">添加公钥</button>
          </div>
        </span>
      </div>
      <p class="muted" style="margin:8px 0 0">管理本机插件：安装、启停、自启、配置、日志、导出。</p>
    </div>

    <div class="card">
      <h1 style="font-size:16px">安装插件</h1>
      <div class="row">
        <button onclick="pickInstall()">上传安装</button>
        <span class="grow"></span>
        <span class="muted">接受 .spk 安装包或 .spkb 备份；安装/导入时替换旧版本</span>
      </div>
      <input type="file" id="file" accept=".spk,.spkb" class="hidden">
      <input type="file" id="trustfile" accept=".pub" class="hidden">
    </div>

    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>插件</th><th>版本</th><th>运行</th><th>自启</th><th style="width:280px">操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted hidden">还没有安装任何插件。</p>
    </div>
  </div>
</div>
<script>
sessionStorage.removeItem('svcd_token');
let BUSY = false;

function safeReturnTo(value) {
  if (!value || !value.startsWith('/') || value.startsWith('//')) return null;
  try {
    const url = new URL(value, location.origin);
    if (url.origin !== location.origin) return null;
    return url.pathname + url.search + url.hash;
  } catch (_) {
    return null;
  }
}
const RETURN_TO = safeReturnTo(new URLSearchParams(location.search).get('next'));

function $(id) { return document.getElementById(id); }

function pickInstall() { if (!BUSY) $('file').click(); }
function pickTrust() { closeMore(); if (!BUSY) $('trustfile').click(); }

function toggleMore(event) {
  if (event) event.stopPropagation();
  const menu = $('moremenu');
  const open = menu.classList.contains('hidden');
  menu.classList.toggle('hidden', !open);
  $('morebtn').setAttribute('aria-expanded', String(open));
}

function closeMore() {
  const menu = $('moremenu');
  if (!menu || menu.classList.contains('hidden')) return;
  menu.classList.add('hidden');
  $('morebtn').setAttribute('aria-expanded', 'false');
}

async function openPluginUI(id) {
  if (BUSY) return;
  lock(true);
  try {
    const body = await api('/api/v1/plugins/' + encodeURIComponent(id) + '/ui-token', { method: 'POST' });
    window.open(body.url, '_blank', 'noopener');
  } catch (error) {
    toast('打开失败：' + error.message, 'err');
  } finally {
    lock(false);
  }
}

function authHeaders(extra) {
  return Object.assign({ 'X-Svcd-Csrf': '1' }, extra || {});
}

function lock(on) {
  BUSY = on;
  $('busymask').classList.toggle('show', on);
}

function toast(message, kind) {
  kind = kind || 'info';
  const box = $('toasts');
  for (const old of Array.from(box.children)) {
    if (old.textContent === message) return;
  }
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = message;
  el.onclick = function () { el.remove(); };
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(function () { el.remove(); }, kind === 'err' ? 8000 : 3000);
}

async function errorText(response) {
  try {
    const body = await response.json();
    if (body && body.error) return body.error.message || body.error.code || ('HTTP ' + response.status);
  } catch (_) {}
  return 'HTTP ' + response.status;
}

async function api(path, options) {
  options = options || {};
  const response = await fetch(path, Object.assign({ credentials: 'same-origin' }, options, {
    headers: authHeaders(options.headers)
  }));
  if (response.status === 401) {
    showLogin();
    throw new Error('需要登录');
  }
  if (!response.ok) throw new Error(await errorText(response));
  return response.json();
}

function showLogin() {
  $('login').classList.remove('hidden');
  $('main').classList.add('hidden');
}

function showMain() {
  $('login').classList.add('hidden');
  $('main').classList.remove('hidden');
  load();
}

function boot() {
  fetch('/api/v1/services', { credentials: 'same-origin', headers: authHeaders() }).then(function (response) {
    if (response.status === 401) { showLogin(); return; }
    if (RETURN_TO) { location.href = RETURN_TO; return; }
    showMain();
  }).catch(function () { showLogin(); });
}

async function login() {
  const password = $('pass').value;
  if (!password) { $('loginMsg').textContent = '请输入密码'; return; }
  try {
    const response = await fetch('/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    });
    if (!response.ok) { $('loginMsg').textContent = '密码错误'; return; }
    $('pass').value = '';
    $('loginMsg').textContent = '';
    if (RETURN_TO) { location.href = RETURN_TO; return; }
    showMain();
  } catch (error) {
    $('loginMsg').textContent = '登录失败：' + error.message;
  }
}

async function logout() {
  try {
    await fetch('/logout', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-Svcd-Csrf': '1' }
    });
  } catch (_) {}
  showLogin();
}

const STATE_TEXT = {
  running: '运行中', starting: '启动中', stopping: '停止中',
  stopped: '已停止', backoff: '退避重试', failed: '失败'
};

function isUp(state) {
  return state === 'running' || state === 'starting' || state === 'stopping';
}

function load() {
  if (BUSY) return;
  api('/api/v1/services').then(function (data) {
    const plugins = (data.services || []).filter(function (service) { return service.kind === 'plugin'; });
    render(plugins);
  }).catch(function (error) {
    toast('加载失败：' + error.message, 'err');
  });
}

function render(plugins) {
  const rows = $('rows');
  rows.innerHTML = '';
  $('empty').classList.toggle('hidden', plugins.length > 0);
  plugins.forEach(function (plugin) {
    const tr = document.createElement('tr');

    const name = document.createElement('td');
    const strong = document.createElement('div');
    // Primary line is the display name; the id stays visible because every
    // command, log file and tool prefix uses it.
    const display = plugin.displayName || plugin.id;
    strong.textContent = display;
    const kind = document.createElement('div');
    kind.className = 'muted';
    kind.textContent = display === plugin.id ? 'plugin' : plugin.id;
    name.appendChild(strong);
    name.appendChild(kind);
    tr.appendChild(name);

    const version = document.createElement('td');
    version.textContent = plugin.version || '';
    tr.appendChild(version);

    const running = isUp(plugin.state);
    const state = document.createElement('td');
    const stateTag = document.createElement('span');
    stateTag.className = 'tag click ' + (running ? 'on' : 'off');
    stateTag.textContent = STATE_TEXT[plugin.state] || plugin.state;
    stateTag.title = running ? '点击停止' : '点击启动';
    stateTag.onclick = function () { act(running ? 'stop' : 'start', plugin.id); };
    state.appendChild(stateTag);
    tr.appendChild(state);

    const auto = document.createElement('td');
    const autoTag = document.createElement('span');
    autoTag.className = 'tag click ' + (plugin.enabled ? 'on' : 'off');
    autoTag.textContent = plugin.enabled ? '开机自启' : '不自启';
    autoTag.title = plugin.enabled ? '点击关闭自启' : '点击开启自启';
    autoTag.onclick = function () { act(plugin.enabled ? 'disable' : 'enable', plugin.id); };
    auto.appendChild(autoTag);
    tr.appendChild(auto);

    const actions = document.createElement('td');
    const actionRow = document.createElement('div');
    actionRow.appendChild(button('日志', 'ghost', function () { openLogs(plugin.id); }));
    actionRow.className = 'actions';
    if (plugin.hasUI === true) {
      const open = button('打开', 'ghost', function () { openPluginUI(plugin.id); });
      open.disabled = plugin.state !== 'running';
      open.title = open.disabled ? '插件未运行，无法打开' : '打开插件 UI';
      actionRow.appendChild(open);
    }
    if (plugin.hasConfig === true) {
      actionRow.appendChild(button('配置', 'ghost', function () { openConfig(plugin.id); }));
    }
    // const installer = button('安装包', 'ghost', function () { exportPlugin(plugin.id, 'spk'); });
    // installer.title = '签名安装包：使用包内的配置模板';
    // actionRow.appendChild(installer);
    const backup = button('导出', 'ghost', function () { exportPlugin(plugin.id, 'backup'); });
    backup.title = '签名安装包 + 当前活动配置（.spkb）';
    actionRow.appendChild(backup);
    actionRow.appendChild(button('删除', 'danger', function () { removePlugin(plugin.id); }));
    actions.appendChild(actionRow);
    tr.appendChild(actions);

    rows.appendChild(tr);
  });
}

function button(label, kind, onclick) {
  const el = document.createElement('button');
  el.className = kind;
  el.textContent = label;
  el.onclick = onclick;
  return el;
}

function act(kind, id) {
  if (BUSY) return;
  lock(true);
  const label = kind === 'start' ? '启动' : kind === 'stop' ? '停止' : kind === 'enable' ? '开启自启' : '关闭自启';
  api('/api/v1/services/' + encodeURIComponent(id) + '/' + kind, { method: 'POST' }).then(function () {
    toast(label + ' ' + id + ' 成功', 'ok');
  }).catch(function (error) {
    toast(label + ' ' + id + ' 失败：' + error.message, 'err');
  }).finally(function () {
    lock(false);
    load();
  });
}

function install() {
  if (BUSY) return;
  const file = $('file').files[0];
  if (!file) { toast('请先选择 .spk 或 .spkb 文件', 'err'); return; }
  const backup = /\.spkb$/i.test(file.name);
  lock(true);
  fetch(backup ? '/api/v1/import?force=true' : '/api/v1/plugins', {
    method: 'POST',
    credentials: 'same-origin',
    headers: authHeaders({ 'Content-Type': 'application/octet-stream' }),
    body: file
  }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    return response.json();
  }).then(function (body) {
    if (backup) {
      toast('已导入备份 ' + body.id + (body.configApplied ? '（含当前配置）' : ''), 'ok');
    } else {
      toast('已安装 ' + body.id + ' ' + body.version, 'ok');
    }
  }).catch(function (error) {
    toast((backup ? '导入失败：' : '安装失败：') + error.message, 'err');
  }).finally(function () {
    $('file').value = '';
    lock(false);
    load();
  });
}

function addTrust() {
  if (BUSY) return;
  const file = $('trustfile').files[0];
  if (!file) { toast('请先选择 .pub 文件', 'err'); return; }
  const keyId = file.name.replace(/\.pub$/i, '');
  if (!/^[A-Za-z0-9._-]+$/.test(keyId) || keyId === '.' || keyId === '..') {
    toast('文件名必须是 <keyId>.pub', 'err');
    return;
  }
  lock(true);
  fetch('/api/v1/trust?key_id=' + encodeURIComponent(keyId), {
    method: 'POST',
    credentials: 'same-origin',
    headers: authHeaders({ 'Content-Type': 'application/octet-stream' }),
    body: file
  }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    return response.json();
  }).then(function (body) {
    toast('已信任 ' + body.keyId, 'ok');
  }).catch(function (error) {
    toast('添加信任公钥失败：' + error.message, 'err');
  }).finally(function () {
    $('trustfile').value = '';
    lock(false);
  });
}

function removePlugin(id) {
  if (BUSY) return;
  if (!confirm('确定删除插件 ' + id + '？将删除版本、配置和日志，且不可恢复。')) return;
  lock(true);
  fetch('/api/v1/plugins/' + encodeURIComponent(id) + '?purge=true', {
    method: 'DELETE',
    credentials: 'same-origin',
    headers: authHeaders()
  }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    toast('已删除 ' + id, 'ok');
  }).catch(function (error) {
    toast('删除失败：' + error.message, 'err');
  }).finally(function () {
    lock(false);
    load();
  });
}

function openConfig(id) {
  if (BUSY) return;
  lock(true);
  fetch('/api/v1/config/' + encodeURIComponent(id), { credentials: 'same-origin', headers: authHeaders() }).then(async function (response) {
    if (response.status === 404) throw new Error('该插件没有配置');
    if (!response.ok) throw new Error(await errorText(response));
    return response.text();
  }).then(function (text) {
    lock(false);
    showConfigModal(id, text);
  }).catch(function (error) {
    lock(false);
    toast('读取配置失败：' + error.message, 'err');
  });
}

function showConfigModal(id, text) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const title = document.createElement('h1');
  title.style.fontSize = '16px';
  title.textContent = '配置：' + id;
  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.textContent = '保存后需要重启插件才生效；校验失败会返回 409 并保留 last-good。';
  const area = document.createElement('textarea');
  area.value = text;
  const exportHint = document.createElement('p');
  exportHint.className = 'muted';
  exportHint.textContent = '这里保存的是活动配置；“安装包”仍使用签名时的模板，带走当前配置请用“导出备份”。';
  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.justifyContent = 'flex-end';
  actions.style.marginTop = '12px';
  const cancel = button('取消', 'ghost', function () { modal.remove(); });
  const save = button('保存', '', function () {
    if (BUSY) return;
    lock(true);
    fetch('/api/v1/config/' + encodeURIComponent(id), {
      method: 'PUT',
      credentials: 'same-origin',
      headers: authHeaders({ 'Content-Type': 'text/plain' }),
      body: area.value
    }).then(async function (response) {
      if (!response.ok) throw new Error(await errorText(response));
      modal.remove();
      toast('配置已保存', 'ok');
    }).catch(function (error) {
      toast('保存失败：' + error.message, 'err');
    }).finally(function () { lock(false); });
  });
  actions.appendChild(cancel);
  actions.appendChild(save);
  panel.appendChild(title);
  panel.appendChild(hint);
  panel.appendChild(area);
  panel.appendChild(exportHint);
  panel.appendChild(actions);
  modal.appendChild(panel);
  document.body.appendChild(modal);
}

function openLogs(id) {
  loadLogs({ kind: 'plugin', id: id });
}

function openDaemonLogs() {
  closeMore();
  loadLogs({ kind: 'daemon' });
}

function logName(target) {
  return target.kind === 'daemon' ? 'svcd' : target.id;
}

function logUrl(target) {
  return target.kind === 'daemon'
    ? '/api/v1/logs'
    : '/api/v1/logs/' + encodeURIComponent(target.id);
}

function loadLogs(target) {
  if (BUSY) return;
  lock(true);
  fetch(logUrl(target) + '?lines=200', { credentials: 'same-origin', headers: authHeaders() }).then(async function (response) {
    if (response.status === 404) throw new Error('还没有日志');
    if (!response.ok) throw new Error(await errorText(response));
    return response.text();
  }).then(function (text) {
    lock(false);
    showLogsModal(target, text);
  }).catch(function (error) {
    lock(false);
    toast('读取日志失败：' + error.message, 'err');
  });
}

function showLogsModal(target, text) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const head = document.createElement('div');
  head.className = 'row';
  const title = document.createElement('h1');
  title.style.fontSize = '16px';
  title.style.margin = '0';
  title.style.flex = '1';
  title.textContent = '日志：' + logName(target);
  const auto = document.createElement('label');
  auto.className = 'check';
  const check = document.createElement('input');
  check.type = 'checkbox';
  auto.appendChild(check);
  auto.appendChild(document.createTextNode('自动刷新（3s）'));
  const levelLabel = document.createElement('label');
  levelLabel.className = 'check';
  levelLabel.appendChild(document.createTextNode('级别'));
  const levelSelect = document.createElement('select');
  [['', '全部'], ['error', 'ERROR'], ['warn', 'WARN+'], ['info', 'INFO+'], ['debug', 'DEBUG+'], ['trace', 'TRACE']].forEach(function (option) {
    const item = document.createElement('option');
    item.value = option[0];
    item.textContent = option[1];
    levelSelect.appendChild(item);
  });
  levelLabel.appendChild(levelSelect);
  head.appendChild(title);
  head.appendChild(auto);
  head.appendChild(levelLabel);
  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.textContent = '最近 200 行。';
  const pre = document.createElement('pre');
  pre.className = 'logs';
  pre.textContent = text;
  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.justifyContent = 'flex-end';
  actions.style.marginTop = '12px';

  let timer = null;
  let level = '';
  function currentUrl() {
    return logUrl(target) + '?lines=200' + (level ? '&level=' + encodeURIComponent(level) : '');
  }
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  async function refresh() {
    try {
      const response = await fetch(currentUrl(), { credentials: 'same-origin', headers: authHeaders() });
      if (response.status === 401) { stop(); showLogin(); return; }
      if (response.status === 404) { pre.textContent = '还没有日志'; return; }
      if (!response.ok) throw new Error(await errorText(response));
      const next = await response.text();
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = next;
      if (atBottom) pre.scrollTop = pre.scrollHeight;
    } catch (_) {
      // Keep the last good snapshot; the next tick retries.
    }
  }
  function close() { stop(); modal.remove(); }
  levelSelect.onchange = function () {
    level = levelSelect.value;
    refresh();
  };
  check.onchange = function () {
    stop();
    if (check.checked) {
      refresh();
      timer = setInterval(refresh, 3000);
    }
  };
  modal.onclick = function (event) { if (event.target === modal) close(); };
  // Two-step clear: the first click asks, the second one deletes. A log is
  // cheap to lose but expensive to explain away, so no one-click path exists.
  let confirming = false;
  const clear = button('清空', 'ghost', function () {
    if (!confirming) {
      confirming = true;
      clear.textContent = '确认清空？';
      clear.classList.remove('ghost');
      clear.classList.add('danger');
      return;
    }
    confirming = false;
    clear.disabled = true;
    clear.textContent = '清空';
    clear.classList.remove('danger');
    clear.classList.add('ghost');
    fetch(logUrl(target), { method: 'DELETE', credentials: 'same-origin', headers: authHeaders() })
      .then(async function (response) {
        if (response.status === 404) throw new Error('没有可清空的日志');
        if (!response.ok) throw new Error(await errorText(response));
        toast('日志已清空', 'ok');
        refresh();
      })
      .catch(function (error) { toast('清空失败：' + error.message, 'err'); })
      .finally(function () { clear.disabled = false; });
  });
  actions.appendChild(clear);
  actions.appendChild(button('关闭', 'ghost', close));
  panel.appendChild(head);
  panel.appendChild(hint);
  panel.appendChild(pre);
  panel.appendChild(actions);
  modal.appendChild(panel);
  document.body.appendChild(modal);
  pre.scrollTop = pre.scrollHeight;
}

function openSettings() {
  if (BUSY) return;
  closeMore();
  lock(true);
  api('/api/v1/settings').then(function (data) {
    lock(false);
    showSettingsModal(data);
  }).catch(function (error) {
    lock(false);
    toast('读取设置失败：' + error.message, 'err');
  });
}

function settingsValueText(value) {
  if (value === null || value === undefined) return '-';
  if (typeof value === 'boolean') return value ? '开' : '关';
  return String(value);
}

const SETTINGS_SOURCE_TEXT = {
  env: '环境变量覆盖',
  file: '来自文件',
  derived: '默认/派生'
};

function settingsTipLine(label, text) {
  const line = document.createElement('div');
  line.className = 'tip-line';
  const tag = document.createElement('span');
  tag.className = 'tip-tag';
  tag.textContent = label + '：';
  line.appendChild(tag);
  line.appendChild(document.createTextNode(text || '-'));
  return line;
}

function hideSettingsTip() {
  const tip = $('tip');
  tip.hidden = true;
  tip.textContent = '';
}

function showSettingsTip(anchor, entry, extra) {
  const tip = $('tip');
  tip.textContent = '';
  const key = document.createElement('div');
  key.className = 'tip-key';
  key.textContent = entry.key;
  tip.appendChild(key);
  tip.appendChild(settingsTipLine('说明', entry.doc));
  tip.appendChild(settingsTipLine('推荐', entry.recommend));
  tip.appendChild(settingsTipLine('默认', entry.default));
  if (extra) tip.appendChild(settingsTipLine('注意', extra));
  tip.hidden = false;
  const gap = 8;
  const rect = anchor.getBoundingClientRect();
  const width = tip.offsetWidth;
  const height = tip.offsetHeight;
  let left = rect.left + rect.width / 2 - width / 2;
  left = Math.max(gap, Math.min(left, window.innerWidth - width - gap));
  let top = rect.bottom + gap;
  if (top + height > window.innerHeight - gap) top = rect.top - height - gap;
  tip.style.left = left + 'px';
  tip.style.top = Math.max(gap, top) + 'px';
}

function settingsHelp(entry, extra) {
  const help = document.createElement('button');
  help.type = 'button';
  help.className = 'help';
  help.textContent = '?';
  help.setAttribute('aria-label', (entry.label || entry.key) + '（' + entry.key + '）的说明');
  help.setAttribute('aria-describedby', 'tip');
  help.addEventListener('mouseenter', function () { showSettingsTip(help, entry, extra); });
  help.addEventListener('mouseleave', hideSettingsTip);
  help.addEventListener('focus', function () { showSettingsTip(help, entry, extra); });
  help.addEventListener('blur', hideSettingsTip);
  help.addEventListener('click', function (event) {
    event.stopPropagation();
    showSettingsTip(help, entry, extra);
  });
  return help;
}

function settingsLabel(entry, extra) {
  const label = document.createElement('div');
  label.className = 'setting-label';
  const name = document.createElement('span');
  name.className = 'setting-name';
  name.textContent = entry.label || entry.key;
  label.appendChild(name);
  label.appendChild(settingsHelp(entry, extra));
  // Provenance is only worth a badge when it is not the derived default; the
  // common case keeps the label column quiet.
  if (entry.source !== 'derived') {
    const source = document.createElement('span');
    source.className = 'setting-source';
    source.textContent = SETTINGS_SOURCE_TEXT[entry.source] || SETTINGS_SOURCE_TEXT.derived;
    label.appendChild(source);
  }
  return label;
}

function showSettingsModal(data) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  const panel = document.createElement('div');
  panel.className = 'panel sheet';

  const head = document.createElement('div');
  head.className = 'sheet-head';
  const title = document.createElement('h1');
  title.textContent = '设置';
  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.style.margin = '4px 0 0';
  hint.textContent = '写入 ' + (data.path || '（未找到 svcd.conf）') +
    '。悬停参数名后的 ? 查看英文名、说明、推荐值与默认值；保存后 daemon 会自动重启（系统服务模式下由服务管理器重启）。';
  head.appendChild(title);
  head.appendChild(hint);

  const body = document.createElement('div');
  body.className = 'sheet-body';

  const changes = {};
  const groups = [];
  const byGroup = {};
  data.keys.forEach(function (entry) {
    if (!byGroup[entry.group]) {
      byGroup[entry.group] = [];
      groups.push(entry.group);
    }
    byGroup[entry.group].push(entry);
  });

  function mark(key, value) {
    changes[key] = value;
  }

  function field(entry) {
    const row = document.createElement('div');
    row.className = 'setting';
    row.appendChild(settingsLabel(entry));

    const control = document.createElement('div');
    control.className = 'setting-control';
    if (!entry.editable) {
      const value = document.createElement('span');
      value.className = 'readonly';
      value.textContent = settingsValueText(entry.effective);
      control.appendChild(value);
      const readOnly = document.createElement('span');
      readOnly.className = 'setting-source';
      readOnly.textContent = '只读';
      control.appendChild(readOnly);
    } else if (entry.kind === 'bool') {
      const select = document.createElement('select');
      [['on', '开'], ['off', '关']].forEach(function (option) {
        const item = document.createElement('option');
        item.value = option[0];
        item.textContent = option[1];
        select.appendChild(item);
      });
      select.value = (entry.value === 'off' ? 'off' : 'on');
      select.onchange = function () { mark(entry.key, select.value); };
      control.appendChild(select);
    } else if (entry.kind === 'enum') {
      const options = entry.key === 'workload'
        ? ['tiny', 'interactive', 'streaming']
        : ['error', 'warn', 'info', 'debug', 'trace'];
      const select = document.createElement('select');
      options.forEach(function (option) {
        const item = document.createElement('option');
        item.value = option;
        item.textContent = option;
        select.appendChild(item);
      });
      select.value = entry.value || entry.effective || options[0];
      select.onchange = function () { mark(entry.key, select.value); };
      control.appendChild(select);
    } else {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = entry.value === null || entry.value === undefined ? '' : entry.value;
      input.placeholder = String(entry.effective === null ? '' : settingsValueText(entry.effective));
      input.oninput = function () { mark(entry.key, input.value === '' ? null : input.value); };
      control.appendChild(input);
    }
    row.appendChild(control);
    return row;
  }

  function passwordField(entry) {
    const row = document.createElement('div');
    row.className = 'setting';
    row.appendChild(settingsLabel(entry, '改密码后旧登录会话失效；清除密码后非回环监听会退回 127.0.0.1。'));

    const control = document.createElement('div');
    control.className = 'setting-control';
    const first = document.createElement('input');
    first.type = 'password';
    first.placeholder = '新密码';
    first.style.width = '150px';
    const second = document.createElement('input');
    second.type = 'password';
    second.placeholder = '确认密码';
    second.style.width = '150px';
    const clearLabel = document.createElement('label');
    clearLabel.className = 'check';
    const clear = document.createElement('input');
    clear.type = 'checkbox';
    clearLabel.appendChild(clear);
    clearLabel.appendChild(document.createTextNode('清除密码'));
    control.appendChild(first);
    control.appendChild(second);
    control.appendChild(clearLabel);
    row.appendChild(control);

    function refresh() {
      if (clear.checked) {
        mark('auth_passwd', null);
        return;
      }
      if (!first.value) {
        delete changes.auth_passwd;
        return;
      }
      if (first.value !== second.value) {
        mark('auth_passwd', undefined);
        return;
      }
      mark('auth_passwd', first.value);
    }
    first.oninput = refresh;
    second.oninput = refresh;
    clear.onchange = refresh;
    return row;
  }

  groups.forEach(function (group) {
    const heading = document.createElement('div');
    heading.className = 'setting-group';
    heading.textContent = group;
    body.appendChild(heading);
    byGroup[group].forEach(function (entry) {
      body.appendChild(entry.kind === 'password-hash' ? passwordField(entry) : field(entry));
    });
  });

  const actions = document.createElement('div');
  actions.className = 'sheet-foot';
  let restartTimer = null;
  let elapsed = 0;
  function stopPolling() {
    if (restartTimer) { clearInterval(restartTimer); restartTimer = null; }
  }
  function waitForRestart() {
    hint.textContent = '正在重启…保存的值在 daemon 回来之后生效。';
    stopPolling();
    restartTimer = setInterval(function () {
      elapsed += 500;
      fetch('/api/v1/version', { credentials: 'same-origin', headers: authHeaders() })
        .then(function (response) {
          if (response.ok) {
            stopPolling();
            location.reload();
          }
        })
        .catch(function () {});
      if (elapsed > 30000) {
        stopPolling();
        hint.textContent = '重启后 30 秒内没有回来；检查日志或用服务管理器手动重启。';
      }
    }, 500);
  }
  const save = button('保存', '', function () {
    if (changes.auth_passwd === undefined) {
      toast('两次输入的密码不一致', 'err');
      return;
    }
    const values = {};
    Object.keys(changes).forEach(function (key) { values[key] = changes[key]; });
    if (Object.keys(values).length === 0) {
      toast('没有改动');
      return;
    }
    save.disabled = true;
    fetch('/api/v1/settings', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ values: values })
    }).then(async function (response) {
      if (!response.ok) throw new Error(await errorText(response));
      return response.json();
    }).then(function (result) {
      save.disabled = false;
      if (result.restarting) {
        waitForRestart();
      } else {
        toast(result.hint || '已保存，重启 daemon 后生效', 'ok');
        modal.remove();
      }
    }).catch(function (error) {
      save.disabled = false;
      toast('保存失败：' + error.message, 'err');
    });
  });
  const close = button('关闭', 'ghost', function () { stopPolling(); hideSettingsTip(); modal.remove(); });
  modal.onclick = function (event) { if (event.target === modal) close(); };
  actions.appendChild(close);
  actions.appendChild(save);
  panel.appendChild(head);
  panel.appendChild(body);
  panel.appendChild(actions);
  modal.appendChild(panel);
  document.body.appendChild(modal);
}

function openUpgrade() {
  if (BUSY) return;
  closeMore();
  lock(true);
  api('/api/v1/upgrade/check').then(function (data) {
    lock(false);
    showUpgradeModal(data);
  }).catch(function (error) {
    lock(false);
    toast('检查更新失败：' + error.message, 'err');
  });
}

function showUpgradeModal(data) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.style.width = '460px';
  panel.style.maxWidth = '90vw';
  const title = document.createElement('h1');
  title.textContent = '检查更新';
  title.style.fontSize = '16px';
  title.style.margin = '0 0 10px';
  panel.appendChild(title);

  const status = document.createElement('p');
  if (!data.store) {
    status.textContent = '没有安装 plugin-store，无法在线检查更新。先安装插件商店，或用 `svcd upgrade --file <归档>` 离线升级。';
  } else {
    status.textContent = '当前 svcd ' + data.current + ' → 最新 ' + (data.latest || '未知') +
      (data.newer ? '（有新版本）' : (data.latest === data.current ? '（已是最新）' : '（当前比线上新，可降级）'));
  }
  panel.appendChild(status);

  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.justifyContent = 'flex-end';
  actions.style.gap = '8px';
  actions.style.marginTop = '12px';
  let timer = null;
  function close() {
    if (timer) { clearInterval(timer); timer = null; }
    modal.remove();
  }
  if (data.store && data.newer) {
    const apply = button('升级并重启', '', function () {
      apply.disabled = true;
      status.textContent = '正在下载并校验升级包…';
      fetch('/api/v1/upgrade/apply', {
        method: 'POST',
        credentials: 'same-origin',
        headers: authHeaders()
      }).then(async function (response) {
        if (!response.ok) throw new Error(await errorText(response));
        return response.json();
      }).then(function (result) {
        if (!result.restarting) {
          status.textContent = result.hint || '已升级，重启 daemon 后生效'; 
          return;
        }
        status.textContent = '正在重启…新版本 ' + result.version;
        const started = Date.now();
        timer = setInterval(function () {
          fetch('/api/v1/version', { credentials: 'same-origin', headers: authHeaders() })
            .then(function (response) { return response.ok ? response.json() : null; })
            .then(function (value) {
              if (value && value.version === result.version) {
                clearInterval(timer);
                timer = null;
                location.reload();
              }
            })
            .catch(function () {});
          if (Date.now() - started > 120000) {
            clearInterval(timer);
            timer = null;
            status.textContent = '升级后 2 分钟内没有回来；检查 `svcd status` 与日志。';
          }
        }, 500);
      }).catch(function (error) {
        apply.disabled = false;
        status.textContent = '升级失败：' + error.message;
      });
    });
    actions.appendChild(apply);
  }
  actions.appendChild(button('关闭', 'ghost', close));
  modal.onclick = function (event) { if (event.target === modal) close(); };
  panel.appendChild(actions);
  modal.appendChild(panel);
  document.body.appendChild(modal);
}

function exportPlugin(id, kind) {
  if (BUSY) return;
  lock(true);
  const backup = kind === 'backup';
  const path = backup
    ? '/api/v1/export/' + encodeURIComponent(id)
    : '/api/v1/export/' + encodeURIComponent(id) + '/spk';
  fetch(path, { credentials: 'same-origin', headers: authHeaders() }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    const blob = await response.blob();
    const disposition = response.headers.get('Content-Disposition') || '';
    let filename = id + (backup ? '.spkb' : '.spk');
    const match = /filename="([^"]+)"/.exec(disposition);
    if (match) filename = match[1];
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast((backup ? '已导出备份（含当前配置） ' : '已导出安装包 ') + filename, 'ok');
  }).catch(function (error) {
    toast('导出失败：' + error.message, 'err');
  }).finally(function () { lock(false); });
}

$('file').addEventListener('change', install);
$('trustfile').addEventListener('change', addTrust);
document.addEventListener('click', function (event) {
  if (!event.target.closest('.menu-wrap')) closeMore();
  if (!event.target.closest('.help')) hideSettingsTip();
});
document.addEventListener('keydown', function (event) {
  if (event.key === 'Escape') {
    closeMore();
    hideSettingsTip();
  }
});
window.addEventListener('scroll', hideSettingsTip, true);
boot();
