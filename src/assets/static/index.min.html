y hidden"><div class="empty-art" aria-hidden="true">+</div><p class="empty-title">还没有安装任何插件</p><p class="muted">点右上角的「上传安装」，选一个 .spk 包开始。</p></div><footer class="app-foot"><span>svcd · <a href="https://github.com/webxxxxx/plugin-manager/blob/main/LICENSE" target="_blank" rel="noopener">Apache-2.0</a></span><span class="foot-links"><a href="https://github.com/webxxxxx/plugin-manager" target="_blank" rel="noopener">开源项目 <span aria-hidden="true">↗</span></a></span></footer><input type="file" id="file" accept=".spk,.spkb" class="hidden"><input type="file" id="trustfile" accept=".pub" class="hidden"></section></div></div><script>sessionStorage.removeItem('svcd_token');

} catch (_) {

}
}

const PLUGIN_EXPAND_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M21 16v5h-5"/><path d="M3 16v5h5"/></svg>';

function showPluginWindow(plugin, url) {

body.appendChild(frame);
body.appendChild(loading);
frame.addEventListener('load', function () { loading.hidden = true; });
function setFull(on) {
panel.classList.toggle('full', on);
overlay.classList.toggle('full', on);
full.innerHTML = on ? PLUGIN_COLLAPSE_ICON : PLUGIN_EXPAND_ICON;
full.title = on ? '退出全屏' : '全屏';
full.setAttribute('aria-label', on ? '退出全屏显示' : '全屏显示');
}
full.onclick = function () { setFull(!panel.classList.contains('full')); };
const previousOverflow = document.body.style.overflow;
document.body.style.overflow = 'hidden';
function onKey(event) {
if (event.key === 'Escape') closeWindow();
}
function closeWindow() {

if (PLUGIN_WINDOW_CLOSE === closeWindow) PLUGIN_WINDOW_CLOSE = null;
}
close.onclick = closeWindow;
overlay.onclick = function (event) { if (event.target === overlay) closeWindow(); };
document.addEventListener('keydown', onKey);
panel.appendChild(head);
panel.appendChild(body);
overlay.appendChild(panel);
document.body.appendChild(overlay);

close.focus();
}
function authHeaders(extra) {
return Object.assign({ 'X-Svcd-Csrf': '1' }, extra || {});
}
function lock(on) {
BUSY = on;
$('busymask').classList.toggle('show', on);
}
function toast(message, kind) {
kind = kind || 'info';
const box = $('toasts');
for (const old of Array.from(box.children)) {
if (old.textContent === message) return;
}
const el = document.createElement('div');
el.className = 'toast ' + kind;
el.textContent = message;
el.onclick = function () { el.remove(); };
box.appendChild(el);
while (box.children.length > 3) box.firstElementChild.remove();
setTimeout(function () { el.remove(); }, kind === 'err' ? 8000 : 3000);

async function errorText(response) {
return (await refusalOf(response)).message;
}
async function refusalOf(response) {
const refusal = { status: response.status, message: 'HTTP ' + response.status, data: null };
try {
const body = await response.json();
if (body && body.error) {
refusal.message = body.error.message || body.error.code || refusal.message;
refusal.data = body.error.data || null;
}
} catch (_) {}
return refusal;
}
async function api(path, options) {
options = options || {};
const response = await fetch(path, Object.assign({ credentials: 'same-origin' }, options, {
headers: authHeaders(options.headers)
}));
if (response.status === 401) {
showLogin();
throw new Error('需要登录');
}
if (!response.ok) throw new Error(await errorText(response));
return response.json();
}
function showLogin() {
$('login').classList.remove('hidden');
$('main').classList.add('hidden');
}
function sessionExpired() {
showLogin();
toast('登录会话已失效，请重新登录', 'info');
}
function showMain() {
$('login').classList.add('hidden');
$('main').classList.remove('hidden');
load();
}
function boot() {
fetch('/api/v1/services', { credentials: 'same-origin', headers: authHeaders() }).then(function (response) {

if (RETURN_TO) { location.href = RETURN_TO; return; }
showMain();

async function login() {
const password = $('pass').value;
if (!password) { $('loginMsg').textContent = '请输入密码'; return; }
try {
const response = await fetch('/login', {
method: 'POST',
credentials: 'same-origin',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ password: password })
});
if (!response.ok) { $('loginMsg').textContent = '密码错误'; return; }
$('pass').value = '';
$('loginMsg').textContent = '';
if (RETURN_TO) { location.href = RETURN_TO; return; }
showMain();
} catch (error) {
$('loginMsg').textContent = '登录失败：' + error.message;
}
}
async function logout() {
try {
await fetch('/logout', {
method: 'POST',
credentials: 'same-origin',
headers: { 'X-Svcd-Csrf': '1' }

const MARK_COLORS = [
['#e8f0ff', '#2f5fcf'],
['#e9f7ef', '#1c7a4b'],
['#fdf0e3', '#9c5a12'],
['#f1edff', '#5744b5'],
['#fdeef1', '#ad3c55'],
['#e8f6f8', '#146b7b'],
];
const STATE_TEXT = {
running: '运行中', starting: '启动中', stopping: '停止中',
stopped: '已停止', backoff: '退避重试', failed: '失败'
};
function isUp(state) {

function load() {

function renderSummary(plugins) {

function render(plugins) {

if (plugin.icon) {
const icon = document.createElement('img');

icon.alt = '';

cell.appendChild(mark);

const main = document.createElement('div');

const strong = document.createElement('div');
strong.className = 'plugin-name';
strong.textContent = plugin.displayName || plugin.id;
main.appendChild(strong);
const where = document.createElement('div');

where.textContent = plugin.id;

badge.hidden = !plugin.installRootIndex;
where.appendChild(badge);
if (plugin.installDir) where.title = '安装位置：' + plugin.installDir;
main.appendChild(where);
cell.appendChild(main);
name.appendChild(cell);
tr.appendChild(name);
const version = document.createElement('td');
version.className = 'version';
version.textContent = plugin.version || '';
tr.appendChild(version);
const running = isUp(plugin.state);
const bad = plugin.state === 'failed' || plugin.state === 'backoff';

stateTag.className = 'tag click ' + (bad ? 'bad' : running ? 'on' : 'off');

tr.appendChild(state);
const auto = document.createElement('td');

autoTag.className = 'tag click auto ' + (plugin.enabled ? 'on' : 'off');
autoTag.textContent = plugin.enabled ? '开机自启' : '不自启';
autoTag.title = plugin.enabled ? '点击关闭自启' : '点击开启自启';
