<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svcd 控制台</title>
<style>
  :root { --blue:#3d8fd1; --line:#e4e8ee; --text:#333; --muted:#888; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#f5f7fa; }
  .wrap { max-width:980px; margin:0 auto; padding:24px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 20px; margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .grow { flex:1; }
  button { border:1px solid var(--blue); background:var(--blue); color:#fff; padding:6px 14px; border-radius:4px; cursor:pointer; font-size:13px; }
  button.ghost { background:#fff; color:var(--blue); }
  button.danger { border-color:#d9534f; background:#d9534f; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input[type=password], input[type=text], select { border:1px solid var(--line); border-radius:4px; padding:6px 10px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
  th { color:var(--muted); font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.on { background:#e8f5e9; color:#2e7d32; }
  .tag.off { background:#fdecea; color:#c62828; }
  .tag.click { cursor:pointer; user-select:none; }
  .tag.click:hover { filter:brightness(0.94); text-decoration:underline; }
  .muted { color:var(--muted); font-size:12px; }
  label.check { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); white-space:nowrap; }
  label.check input { margin:0; }
  .hidden { display:none; }
  .tablewrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tablewrap table { min-width:640px; }
  #busymask { position:fixed; inset:0; background:rgba(255,255,255,.55); z-index:998; display:none; align-items:center; justify-content:center; }
  #busymask.show { display:flex; }
  #waitspin { width:42px; height:42px; border:4px solid #d6e4f3; border-top-color:var(--blue); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toasts { position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast { min-width:260px; max-width:70vw; padding:10px 16px; border-radius:6px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.16); cursor:pointer; white-space:pre-wrap; word-break:break-word; }
  .toast.err { background:#fdecea; color:#b3261e; border:1px solid #f5c2bd; }
  .toast.ok { background:#e8f5e9; color:#1b5e20; border:1px solid #bfe3c3; }
  .toast.info { background:#e8f0fe; color:#1a3c8f; border:1px solid #c2d4f8; }
  .actions { display:flex; gap:6px; flex-wrap:wrap;justify-content: right; }
  .actions button { padding:4px 10px; font-size:12px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:99; padding:16px; }
  .modal .panel { background:#fff; border-radius:8px; padding:16px; width:min(780px,100%); max-height:90vh; overflow:auto; }
  .modal textarea { width:100%; height:360px; font-family:monospace; font-size:12px; border:1px solid var(--line); border-radius:4px; padding:8px; }
  .modal pre { background:#f7f8fa; border:1px solid var(--line); border-radius:4px; padding:10px; max-height:50vh; overflow:auto; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .modal pre.logs { height:382px; max-height:none; overflow:auto; line-height:1.5; }
  @media (max-width:760px) {
    .wrap { padding:12px; }
    h1 { font-size:18px; }
    .card { padding:12px 14px; }
    #toasts { left:8px; right:8px; transform:none; align-items:stretch; }
    .toast { max-width:none; min-width:0; }
  }
</style>
</head>
<body>
<div id="busymask"><div id="waitspin"></div></div>
<div id="toasts"></div>
<div class="wrap">
  <div id="login" class="card hidden">
    <h1>svcd 控制台</h1>
    <p class="muted">输入 `svc auth passwd` 设置的密码（默认 loopback 无需登录，直接打开即可）。</p>
    <div class="row">
      <input id="pass" type="password" placeholder="密码" style="width:280px">
      <button onclick="login()">登录</button>
      <span id="loginMsg" class="muted"></span>
    </div>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <div class="row">
        <h1 class="grow" style="margin:0">svcd 控制台</h1>
        <button class="ghost" onclick="pickTrust()">上传公钥</button>
        <button class="ghost" onclick="load()">刷新</button>
        <button class="ghost" onclick="logout()">退出</button>
      </div>
      <p class="muted" style="margin:8px 0 0">管理本机插件：安装、启停、自启、配置、日志、导出。</p>
    </div>

    <div class="card">
      <h1 style="font-size:16px">安装插件</h1>
      <div class="row">
        <button onclick="pickInstall()">上传安装</button>
        <span class="grow"></span>
        <span class="muted">接受 .spk 安装包或 .spkb 备份；安装/导入时替换旧版本</span>
      </div>
      <input type="file" id="file" accept=".spk,.spkb" class="hidden">
      <input type="file" id="trustfile" accept=".pub" class="hidden">
    </div>

    <div class="card">
      <div class="tablewrap">
        <table>
          <thead><tr><th>插件</th><th>版本</th><th>运行</th><th>自启</th><th style="width:280px">操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted hidden">还没有安装任何插件。</p>
      <p class="muted" style="margin:8px 0 0">“安装包”是签名时的配置模板；“导出备份”包含当前修改的配置，可直接用上方“上传安装”导入恢复。</p>
    </div>
  </div>
</div>
<script>
sessionStorage.removeItem('svcd_token');
let BUSY = false;

function safeReturnTo(value) {
  if (!value || !value.startsWith('/') || value.startsWith('//')) return null;
  try {
    const url = new URL(value, location.origin);
    if (url.origin !== location.origin) return null;
    return url.pathname + url.search + url.hash;
  } catch (_) {
    return null;
  }
}
const RETURN_TO = safeReturnTo(new URLSearchParams(location.search).get('next'));

function $(id) { return document.getElementById(id); }

function pickInstall() { if (!BUSY) $('file').click(); }
function pickTrust() { if (!BUSY) $('trustfile').click(); }

function openPluginUI(id) {
  window.open('/plugin-ui/' + encodeURIComponent(id) + '/', '_blank', 'noopener');
}

function authHeaders(extra) {
  return Object.assign({ 'X-Svcd-Csrf': '1' }, extra || {});
}

function lock(on) {
  BUSY = on;
  $('busymask').classList.toggle('show', on);
}

function toast(message, kind) {
  kind = kind || 'info';
  const box = $('toasts');
  for (const old of Array.from(box.children)) {
    if (old.textContent === message) return;
  }
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = message;
  el.onclick = function () { el.remove(); };
  box.appendChild(el);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(function () { el.remove(); }, kind === 'err' ? 8000 : 3000);
}

async function errorText(response) {
  try {
    const body = await response.json();
    if (body && body.error) return body.error.message || body.error.code || ('HTTP ' + response.status);
  } catch (_) {}
  return 'HTTP ' + response.status;
}

async function api(path, options) {
  options = options || {};
  const response = await fetch(path, Object.assign({ credentials: 'same-origin' }, options, {
    headers: authHeaders(options.headers)
  }));
  if (response.status === 401) {
    showLogin();
    throw new Error('需要登录');
  }
  if (!response.ok) throw new Error(await errorText(response));
  return response.json();
}

function showLogin() {
  $('login').classList.remove('hidden');
  $('main').classList.add('hidden');
}

function showMain() {
  $('login').classList.add('hidden');
  $('main').classList.remove('hidden');
  load();
}

function boot() {
  fetch('/api/v1/services', { credentials: 'same-origin', headers: authHeaders() }).then(function (response) {
    if (response.status === 401) { showLogin(); return; }
    if (RETURN_TO) { location.href = RETURN_TO; return; }
    showMain();
  }).catch(function () { showLogin(); });
}

async function login() {
  const password = $('pass').value;
  if (!password) { $('loginMsg').textContent = '请输入密码'; return; }
  try {
    const response = await fetch('/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password })
    });
    if (!response.ok) { $('loginMsg').textContent = '密码错误'; return; }
    $('pass').value = '';
    $('loginMsg').textContent = '';
    if (RETURN_TO) { location.href = RETURN_TO; return; }
    showMain();
  } catch (error) {
    $('loginMsg').textContent = '登录失败：' + error.message;
  }
}

async function logout() {
  try {
    await fetch('/logout', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'X-Svcd-Csrf': '1' }
    });
  } catch (_) {}
  showLogin();
}

const STATE_TEXT = {
  running: '运行中', starting: '启动中', stopping: '停止中',
  stopped: '已停止', backoff: '退避重试', failed: '失败'
};

function isUp(state) {
  return state === 'running' || state === 'starting' || state === 'stopping';
}

function load() {
  if (BUSY) return;
  api('/api/v1/services').then(function (data) {
    const plugins = (data.services || []).filter(function (service) { return service.kind === 'plugin'; });
    render(plugins);
  }).catch(function (error) {
    toast('加载失败：' + error.message, 'err');
  });
}

function render(plugins) {
  const rows = $('rows');
  rows.innerHTML = '';
  $('empty').classList.toggle('hidden', plugins.length > 0);
  plugins.forEach(function (plugin) {
    const tr = document.createElement('tr');

    const name = document.createElement('td');
    const strong = document.createElement('div');
    strong.textContent = plugin.id;
    const kind = document.createElement('div');
    kind.className = 'muted';
    kind.textContent = 'plugin';
    name.appendChild(strong);
    name.appendChild(kind);
    tr.appendChild(name);

    const version = document.createElement('td');
    version.textContent = plugin.version || '';
    tr.appendChild(version);

    const running = isUp(plugin.state);
    const state = document.createElement('td');
    const stateTag = document.createElement('span');
    stateTag.className = 'tag click ' + (running ? 'on' : 'off');
    stateTag.textContent = STATE_TEXT[plugin.state] || plugin.state;
    stateTag.title = running ? '点击停止' : '点击启动';
    stateTag.onclick = function () { act(running ? 'stop' : 'start', plugin.id); };
    state.appendChild(stateTag);
    tr.appendChild(state);

    const auto = document.createElement('td');
    const autoTag = document.createElement('span');
    autoTag.className = 'tag click ' + (plugin.enabled ? 'on' : 'off');
    autoTag.textContent = plugin.enabled ? '开机自启' : '不自启';
    autoTag.title = plugin.enabled ? '点击关闭自启' : '点击开启自启';
    autoTag.onclick = function () { act(plugin.enabled ? 'disable' : 'enable', plugin.id); };
    auto.appendChild(autoTag);
    tr.appendChild(auto);

    const actions = document.createElement('td');
    const actionRow = document.createElement('div');
    actionRow.className = 'actions';
    if (plugin.hasUI === true) {
      const open = button('打开', 'ghost', function () { openPluginUI(plugin.id); });
      open.disabled = plugin.state !== 'running';
      open.title = open.disabled ? '插件未运行，无法打开' : '打开插件 UI';
      actionRow.appendChild(open);
    }
    if (plugin.hasConfig === true) {
      actionRow.appendChild(button('配置', 'ghost', function () { openConfig(plugin.id); }));
    }
    actionRow.appendChild(button('日志', 'ghost', function () { openLogs(plugin.id); }));
    const installer = button('安装包', 'ghost', function () { exportPlugin(plugin.id, 'spk'); });
    installer.title = '签名安装包：使用包内的配置模板';
    actionRow.appendChild(installer);
    const backup = button('导出备份', 'ghost', function () { exportPlugin(plugin.id, 'backup'); });
    backup.title = '签名安装包 + 当前活动配置（.spkb）';
    actionRow.appendChild(backup);
    actionRow.appendChild(button('删除', 'danger', function () { removePlugin(plugin.id); }));
    actions.appendChild(actionRow);
    tr.appendChild(actions);

    rows.appendChild(tr);
  });
}

function button(label, kind, onclick) {
  const el = document.createElement('button');
  el.className = kind;
  el.textContent = label;
  el.onclick = onclick;
  return el;
}

function act(kind, id) {
  if (BUSY) return;
  lock(true);
  const label = kind === 'start' ? '启动' : kind === 'stop' ? '停止' : kind === 'enable' ? '开启自启' : '关闭自启';
  api('/api/v1/services/' + encodeURIComponent(id) + '/' + kind, { method: 'POST' }).then(function () {
    toast(label + ' ' + id + ' 成功', 'ok');
  }).catch(function (error) {
    toast(label + ' ' + id + ' 失败：' + error.message, 'err');
  }).finally(function () {
    lock(false);
    load();
  });
}

function install() {
  if (BUSY) return;
  const file = $('file').files[0];
  if (!file) { toast('请先选择 .spk 或 .spkb 文件', 'err'); return; }
  const backup = /\.spkb$/i.test(file.name);
  lock(true);
  fetch(backup ? '/api/v1/import?force=true' : '/api/v1/plugins', {
    method: 'POST',
    credentials: 'same-origin',
    headers: authHeaders({ 'Content-Type': 'application/octet-stream' }),
    body: file
  }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    return response.json();
  }).then(function (body) {
    if (backup) {
      toast('已导入备份 ' + body.id + (body.configApplied ? '（含当前配置）' : ''), 'ok');
    } else {
      toast('已安装 ' + body.id + ' ' + body.version, 'ok');
    }
  }).catch(function (error) {
    toast((backup ? '导入失败：' : '安装失败：') + error.message, 'err');
  }).finally(function () {
    $('file').value = '';
    lock(false);
    load();
  });
}

function addTrust() {
  if (BUSY) return;
  const file = $('trustfile').files[0];
  if (!file) { toast('请先选择 .pub 文件', 'err'); return; }
  const keyId = file.name.replace(/\.pub$/i, '');
  if (!/^[A-Za-z0-9._-]+$/.test(keyId) || keyId === '.' || keyId === '..') {
    toast('文件名必须是 <keyId>.pub', 'err');
    return;
  }
  lock(true);
  fetch('/api/v1/trust?key_id=' + encodeURIComponent(keyId), {
    method: 'POST',
    credentials: 'same-origin',
    headers: authHeaders({ 'Content-Type': 'application/octet-stream' }),
    body: file
  }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    return response.json();
  }).then(function (body) {
    toast('已信任 ' + body.keyId, 'ok');
  }).catch(function (error) {
    toast('添加信任公钥失败：' + error.message, 'err');
  }).finally(function () {
    $('trustfile').value = '';
    lock(false);
  });
}

function removePlugin(id) {
  if (BUSY) return;
  if (!confirm('确定删除插件 ' + id + '？将删除版本、配置和日志，且不可恢复。')) return;
  lock(true);
  fetch('/api/v1/plugins/' + encodeURIComponent(id) + '?purge=true', {
    method: 'DELETE',
    credentials: 'same-origin',
    headers: authHeaders()
  }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    toast('已删除 ' + id, 'ok');
  }).catch(function (error) {
    toast('删除失败：' + error.message, 'err');
  }).finally(function () {
    lock(false);
    load();
  });
}

function openConfig(id) {
  if (BUSY) return;
  lock(true);
  fetch('/api/v1/config/' + encodeURIComponent(id), { credentials: 'same-origin', headers: authHeaders() }).then(async function (response) {
    if (response.status === 404) throw new Error('该插件没有配置');
    if (!response.ok) throw new Error(await errorText(response));
    return response.text();
  }).then(function (text) {
    lock(false);
    showConfigModal(id, text);
  }).catch(function (error) {
    lock(false);
    toast('读取配置失败：' + error.message, 'err');
  });
}

function showConfigModal(id, text) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const title = document.createElement('h1');
  title.style.fontSize = '16px';
  title.textContent = '配置：' + id;
  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.textContent = '保存后需要重启插件才生效；校验失败会返回 409 并保留 last-good。';
  const area = document.createElement('textarea');
  area.value = text;
  const exportHint = document.createElement('p');
  exportHint.className = 'muted';
  exportHint.textContent = '这里保存的是活动配置；“安装包”仍使用签名时的模板，带走当前配置请用“导出备份”。';
  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.justifyContent = 'flex-end';
  actions.style.marginTop = '12px';
  const cancel = button('取消', 'ghost', function () { modal.remove(); });
  const save = button('保存', '', function () {
    if (BUSY) return;
    lock(true);
    fetch('/api/v1/config/' + encodeURIComponent(id), {
      method: 'PUT',
      credentials: 'same-origin',
      headers: authHeaders({ 'Content-Type': 'text/plain' }),
      body: area.value
    }).then(async function (response) {
      if (!response.ok) throw new Error(await errorText(response));
      modal.remove();
      toast('配置已保存', 'ok');
    }).catch(function (error) {
      toast('保存失败：' + error.message, 'err');
    }).finally(function () { lock(false); });
  });
  actions.appendChild(cancel);
  actions.appendChild(save);
  panel.appendChild(title);
  panel.appendChild(hint);
  panel.appendChild(area);
  panel.appendChild(exportHint);
  panel.appendChild(actions);
  modal.appendChild(panel);
  document.body.appendChild(modal);
}

function openLogs(id) {
  if (BUSY) return;
  lock(true);
  fetch('/api/v1/logs/' + encodeURIComponent(id) + '?lines=200', { credentials: 'same-origin', headers: authHeaders() }).then(async function (response) {
    if (response.status === 404) throw new Error('还没有日志');
    if (!response.ok) throw new Error(await errorText(response));
    return response.text();
  }).then(function (text) {
    lock(false);
    showLogsModal(id, text);
  }).catch(function (error) {
    lock(false);
    toast('读取日志失败：' + error.message, 'err');
  });
}

function showLogsModal(id, text) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  const panel = document.createElement('div');
  panel.className = 'panel';
  const head = document.createElement('div');
  head.className = 'row';
  const title = document.createElement('h1');
  title.style.fontSize = '16px';
  title.style.margin = '0';
  title.style.flex = '1';
  title.textContent = '日志：' + id;
  const auto = document.createElement('label');
  auto.className = 'check';
  const check = document.createElement('input');
  check.type = 'checkbox';
  auto.appendChild(check);
  auto.appendChild(document.createTextNode('自动刷新（3s）'));
  head.appendChild(title);
  head.appendChild(auto);
  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.textContent = '最近 200 行。';
  const pre = document.createElement('pre');
  pre.className = 'logs';
  pre.textContent = text;
  const actions = document.createElement('div');
  actions.className = 'row';
  actions.style.justifyContent = 'flex-end';
  actions.style.marginTop = '12px';

  let timer = null;
  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
  }
  async function refresh() {
    try {
      const response = await fetch('/api/v1/logs/' + encodeURIComponent(id) + '?lines=200', { credentials: 'same-origin', headers: authHeaders() });
      if (response.status === 401) { stop(); showLogin(); return; }
      if (response.status === 404) { pre.textContent = '还没有日志'; return; }
      if (!response.ok) throw new Error(await errorText(response));
      const next = await response.text();
      const atBottom = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 4;
      pre.textContent = next;
      if (atBottom) pre.scrollTop = pre.scrollHeight;
    } catch (_) {
      // Keep the last good snapshot; the next tick retries.
    }
  }
  function close() { stop(); modal.remove(); }
  check.onchange = function () {
    stop();
    if (check.checked) {
      refresh();
      timer = setInterval(refresh, 3000);
    }
  };
  modal.onclick = function (event) { if (event.target === modal) close(); };
  actions.appendChild(button('关闭', 'ghost', close));
  panel.appendChild(head);
  panel.appendChild(hint);
  panel.appendChild(pre);
  panel.appendChild(actions);
  modal.appendChild(panel);
  document.body.appendChild(modal);
  pre.scrollTop = pre.scrollHeight;
}

function exportPlugin(id, kind) {
  if (BUSY) return;
  lock(true);
  const backup = kind === 'backup';
  const path = backup
    ? '/api/v1/export/' + encodeURIComponent(id)
    : '/api/v1/export/' + encodeURIComponent(id) + '/spk';
  fetch(path, { credentials: 'same-origin', headers: authHeaders() }).then(async function (response) {
    if (!response.ok) throw new Error(await errorText(response));
    const blob = await response.blob();
    const disposition = response.headers.get('Content-Disposition') || '';
    let filename = id + (backup ? '.spkb' : '.spk');
    const match = /filename="([^"]+)"/.exec(disposition);
    if (match) filename = match[1];
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast((backup ? '已导出备份（含当前配置） ' : '已导出安装包 ') + filename, 'ok');
  }).catch(function (error) {
    toast('导出失败：' + error.message, 'err');
  }).finally(function () { lock(false); });
}

$('file').addEventListener('change', install);
$('trustfile').addEventListener('change', addTrust);
boot();
</script>
</body>
</html>
