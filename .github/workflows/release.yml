name: release

# A version tag publishes the archives built by build.yml. The tag must be
# `v` + the version in Cargo.toml; build.yml fails otherwise before doing any
# work. Push a tag only after the same matrix passed on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: svcd-*
          merge-multiple: true
      - name: Verify the artifact set
        run: |
          set -euo pipefail
          ls -l dist
          # Keep in sync with the matrix in build.yml: 5 Linux + 1 Windows + 1 macOS.
          count="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')"
          if [ "$count" -ne 7 ]; then
            echo "::error::expected 7 archives, found $count"
            exit 1
          fi
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
