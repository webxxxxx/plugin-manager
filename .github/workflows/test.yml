name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }}
    # A release bump commit only changes the version string, and the tag pushed
    # right after it runs the same matrix through release.yml. `ref_type` keeps
    # that tag call running: only a branch push is skipped (#319).
    if: ${{ github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Clippy
        run: node tools/check.mjs lint
      - name: Unit tests (parallel)
        run: cargo test --bin svcd --no-fail-fast -- --test-threads=4
      - name: Integration tests (one cap per target)
        # The tier discovers tests/*.rs itself; no second hardcoded list.
        run: node tools/check.mjs integration
      - name: Check minimal build without HTTP
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --no-default-features
      - name: Build for the sample .spk smoke test
        if: matrix.os == 'ubuntu-latest'
        run: cargo build
      - name: Sample .spk smoke (dependencies, MCP, WebSocket, SSE)
        if: matrix.os == 'ubuntu-latest'
        run: |
          node tools/gen_sample_key.mjs
          python3 tools/spk_smoke.py --binary target/debug/svcd

  guardrails:
    name: guardrails / closed tickets merged
    # A release bump commit only changes the version string, and the tag pushed
    # right after it runs the same matrix through release.yml. `ref_type` keeps
    # that tag call running: only a branch push is skipped (#319).
    if: ${{ github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Architecture rules (dep-lint)
        run: node tools/dep-lint.mjs
      - name: Formatting (rustfmt)
        run: node tools/check.mjs fmt
      - name: Source size budget (size-lint)
        run: node tools/check.mjs size
      - name: Every closed #112 ticket has a commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/closed-tickets-merged.mjs --map 112 --base origin/main

  mem-levels:
    name: mem-level / ${{ matrix.level }}
    # A release bump commit only changes the version string, and the tag pushed
    # right after it runs the same matrix through release.yml. `ref_type` keeps
    # that tag call running: only a branch push is skipped (#319).
    if: ${{ github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        level: [low, middle, high]
    env:
      MEM_LEVEL: ${{ matrix.level }}
      CARGO_TARGET_DIR: target/mem-${{ matrix.level }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mem-${{ matrix.level }}
      - name: Limits tests under ${{ matrix.level }}
        run: cargo test --bin svcd limits::tests -- --test-threads=1
      - name: Minimal svcd.conf keeps the daemon alive (#108)
        run: cargo test --test http minimal_svcd_conf -- --test-threads=1
      - name: Check the profile compiles
        run: cargo check --bin svcd
