<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>svcd realtime UI sample</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 24px; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #11151c; color: #d9e2ec; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.hint { margin: 0 0 20px; color: #8aa0b8; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
      section { border: 1px solid #2b3645; border-radius: 10px; padding: 14px; background: #151b24; }
      h2 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
      button { border: 1px solid #3b4b60; border-radius: 6px; background: #1d2632; color: #d9e2ec; padding: 6px 10px; cursor: pointer; }
      button:hover { background: #263243; }
      .state { color: #8aa0b8; }
      .state.ok { color: #7bd88f; }
      .state.bad { color: #ff8b8b; }
      pre { margin: 0; height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; background: #0c1016; border: 1px solid #222c39; border-radius: 6px; padding: 10px; font: 12px/1.45 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>svcd realtime UI sample</h1>
    <p class="hint">SSE = server → UI (EventSource) + POST /rpc for uplink. WebSocket = full duplex JSON-RPC.</p>
    <div class="grid">
      <section>
        <h2>SSE + POST /rpc</h2>
        <div class="row">
          <button id="sse-call">Call echo</button>
          <button id="sse-reconnect">Close / reconnect</button>
          <span id="sse-state" class="state">connecting…</span>
        </div>
        <pre id="sse-log"></pre>
      </section>
      <section>
        <h2>WebSocket (bidirectional)</h2>
        <div class="row">
          <button id="ws-call">Call echo</button>
          <button id="ws-reconnect">Reconnect</button>
          <span id="ws-state" class="state">connecting…</span>
        </div>
        <pre id="ws-log"></pre>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
