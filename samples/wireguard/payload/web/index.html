<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>WireGuard</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; }
  pre { background: #f4f4f4; padding: 1rem; }
  button { margin-right: .5rem; }
</style>
<h1>WireGuard</h1>
<p>Sample plugin UI. It calls the same capability surface over <code>POST /plugin-ui/wireguard/rpc</code>, which svcd bridges to this plugin's stdio channel.</p>
<pre id="out">loading...</pre>
<button id="up">up</button><button id="down">down</button>
<script>
  function rpc(name, args) {
    return fetch('rpc', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: Date.now(),
        method: 'tools/call',
        params: { name: name, arguments: args || {} }
      })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error) return 'error ' + j.error.code + ': ' + j.error.message;
      return j.result.content[0].text;
    });
  }
  var out = document.getElementById('out');
  function show(p) { p.then(function (t) { out.textContent = t; }); }
  show(rpc('status'));
  document.getElementById('up').onclick = function () {
    show(rpc('up', { config: '[Interface]\nListenPort = 51820\n[Peer]\nPublicKey = demo' }));
  };
  document.getElementById('down').onclick = function () { show(rpc('down')); };
</script>
