[package]
name = "svcd"
version = "0.1.17"
edition = "2021"
description = "svcd core: service supervisor, registry and local CLI"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[features]
default = ["http"]
# HTTP management API, embedded console, plugin web UI, LAN auth and MCP HTTP.
# Disable for a small embedded supervisor: `--no-default-features`.
http = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[build-dependencies]
# Compresses the embedded console at build time; rust_backend keeps the build
# pure Rust so every cross target produces the same bytes without system zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
