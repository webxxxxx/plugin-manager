[package]
name = "svcd"
version = "0.1.1"
edition = "2021"
description = "svcd core: service supervisor, registry and local CLI"

[features]
default = ["http"]
# HTTP management API, embedded console, plugin web UI, LAN auth and MCP HTTP.
# Disable for a small embedded supervisor: `--no-default-features`.
http = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
