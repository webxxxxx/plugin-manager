[package]
name = "svcd"
version = "0.1.0"
edition = "2021"
description = "svcd core size fixture (skeleton for the CI size gate)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
